sonar.projectKey=custom-web-builder
sonar.projectName=Custom Web Builder
sonar.projectVersion=0.0.1
sonar.organization=cesarrodrigu

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**/*,**/test/**/*

sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/coverage/**,**/.astro/**,generator/public/**

sonar.javascript.lcov.reportPaths=generator/coverage/lcov.info

sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes

sonar.coverage.jacoco.xmlReportPaths=catalog/target/site/jacoco/jacoco.xml

sonar.log.level=DEBUG
