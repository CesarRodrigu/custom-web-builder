name: Tests and SonarQube coverage

on:
  push:
    branches: [main]
    paths:
      - "generator/**"
      - "front-end/**"
      - "shared/**"
      - "catalog/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    branches: [main]
    paths:
      - "generator/**"
      - "front-end/**"
      - "shared/**"
      - "catalog/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GENERATOR_PROJECT_DIR: generator
  FRONTEND_PROJECT_DIR: front-end
  SHARED_PROJECT_DIR: shared
  CATALOGUE_PROJECT_DIR: catalog

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test-shared:
    name: JavaScript/TypeScript tests and coverage (shared)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1
        with:
          version: 12
          runtime: node@26
          working-directory: .
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true

      - name: Run unit tests with coverage
        run: pnpm --filter @custom-web-builder/shared test:unit:coverage

      - name: Upload JS coverage report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: shared-coverage
          path: ${{ env.SHARED_PROJECT_DIR }}/coverage/lcov.info
          retention-days: 7

  test-frontend:
    name: JavaScript/TypeScript tests and coverage (frontend)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1
        with:
          version: 12
          runtime: node@26
          working-directory: .
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true

      - name: Run unit tests with coverage
        run: pnpm --filter front-end test:unit:coverage

      - name: Upload JS coverage report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.FRONTEND_PROJECT_DIR }}-coverage
          path: ${{ env.FRONTEND_PROJECT_DIR }}/coverage/lcov.info
          retention-days: 7
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter front-end exec playwright install --with-deps

      - name: Install OS dependencies for browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter front-end exec playwright install-deps

      - name: Run end-to-end tests
        run: pnpm --filter front-end test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.FRONTEND_PROJECT_DIR }}-playwright-report
          path: ${{ env.FRONTEND_PROJECT_DIR }}/playwright-report/
          retention-days: 7

  test-generator:
    name: JavaScript/TypeScript tests and coverage (generator)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1
        with:
          version: 12
          runtime: node@26
          working-directory: .
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true

      - name: Run unit tests with coverage
        run: pnpm --filter generator test:unit:coverage

      - name: Upload JS coverage report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.GENERATOR_PROJECT_DIR }}-coverage
          path: ${{ env.GENERATOR_PROJECT_DIR }}/coverage/lcov.info
          retention-days: 7

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter generator exec playwright install --with-deps

      - name: Install OS dependencies for browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter generator exec playwright install-deps

      - name: Run end-to-end tests
        run: pnpm --filter generator test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.GENERATOR_PROJECT_DIR }}-playwright-report
          path: ${{ env.GENERATOR_PROJECT_DIR }}/playwright-report/
          retention-days: 7

  test-catalogue:
    name: Java tests and coverage (catalogue)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run Java tests with coverage
        working-directory: ${{ env.CATALOGUE_PROJECT_DIR }}
        run: mvn -B verify -Pcoverage

      - name: Upload Java coverage report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.CATALOGUE_PROJECT_DIR }}-coverage
          path: |
            ${{ env.CATALOGUE_PROJECT_DIR }}/target/site/jacoco/jacoco.xml
            ${{ env.CATALOGUE_PROJECT_DIR }}/target/classes/
          retention-days: 7

  sonar:
    name: SonarQube scan and quality gate
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: [test-shared, test-generator, test-frontend, test-catalogue]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download JS coverage report (shared)
        uses: actions/download-artifact@v8
        with:
          name: shared-coverage
          path: ${{ env.SHARED_PROJECT_DIR }}/coverage
      - name: Download JS coverage report (generator)
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.GENERATOR_PROJECT_DIR }}-coverage
          path: ${{ env.GENERATOR_PROJECT_DIR }}/coverage
      - name: Download JS coverage report (frontend)
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.FRONTEND_PROJECT_DIR }}-coverage
          path: ${{ env.FRONTEND_PROJECT_DIR }}/coverage

      - name: Download Java coverage report
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CATALOGUE_PROJECT_DIR }}-coverage
          path: ${{ env.CATALOGUE_PROJECT_DIR }}/target/

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
